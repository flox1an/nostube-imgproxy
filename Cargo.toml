[package]
name = "rust-imgproxy"
version = "0.1.8"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["http1", "json"] }
axum-extra = { version = "0.12", features = ["query"] }
tower = { version = "0.5", features = ["limit", "load-shed"] }
tower-http = { version = "0.7", features = ["cors", "timeout", "trace", "limit", "catch-panic"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "sync", "process", "signal", "net"] }
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
# `rustls-no-provider` (not `rustls`) is deliberate: `rustls` pulls the
# aws-lc-rs provider, while nostr-sdk's websocket stack pulls ring. Both
# unify onto one rustls, leaving the process-level CryptoProvider ambiguous
# and panicking every relay TLS handshake. Ring-only keeps it unambiguous
# (and matches reqwest 0.12's behaviour, with no cmake needed to build).
# `default-features = false` drops reqwest's `default-tls`, which would
# otherwise re-enable the `rustls` (aws-lc-rs) feature behind our back.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "gzip", "brotli", "stream"] }
# Direct dep so we can install the ring provider explicitly at startup;
# `rustls-no-provider` makes that installation mandatory.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
parking_lot = "0.12"
# `default-features = false` is load-bearing: the `default-formats` feature
# would activate a dozen extra decoders (exr, dds, hdr, tga, pnm, qoi, ico,
# bmp, tiff) of which only PNG/JPEG/GIF/TIFF budget memory via `set_limits` —
# every other default decoder sniffs magic bytes and allocates an unbounded
# intermediate buffer. `avif-native` is dropped because its decoder runs the
# full dav1d decode before `image::Limits` can apply. AVIF stays an *output*
# format via `ravif` (see `transform.rs::encode_image`).
# `decode_image` enforces the PNG/JPEG/WebP/GIF input allowlist at runtime as
# defense-in-depth against feature unification re-enabling decoders.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
webp = "0.3"
ravif = "0.13"
rgb = "0.8"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
mime = "0.3"
walkdir = "2"
fs2 = "0.4"
tempfile = "3"
nostr-sdk = "0.45.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = "0.14"
lazy_static = "1.5"
# Direct dep for `O_NOFOLLOW` in `write_cache_atomic` symlink hardening
# (src/cache.rs). Already present in the lock as a transitive dep.
libc = "0.2"
url = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `panic = "abort"` is deliberately NOT set: untrusted image data is decoded on
# blocking worker threads, and unwinding lets a decoder panic surface as a 500
# instead of taking the whole edge node down.
strip = true
