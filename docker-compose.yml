services:
  rust-imgproxy:
    image: ghcr.io/flox1an/nostube-imgproxy:main
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-imgproxy
    restart: unless-stopped
    # Hardening — see docs/operations.md. The service writes only /cache and /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    # Local use only. Behind a reverse proxy, drop `ports` and set
    # TRUSTED_PROXY_CIDRS to the proxy network instead.
    ports:
      - "8080:8080"
    volumes:
      # Persist cache across container restarts
      - ./cache:/cache
    environment:
      - BIND_ADDR=0.0.0.0:8080
      - CACHE_DIR=/cache
      - CACHE_TTL_SECS=86400
      - FETCH_TIMEOUT_SECS=10
      - BLOSSOM_NEGATIVE_CACHE_NOT_FOUND_TTL_SECS=900
      - BLOSSOM_NEGATIVE_CACHE_PERMANENT_TTL_SECS=3600
      - BLOSSOM_NEGATIVE_CACHE_TRANSIENT_TTL_SECS=60
      - MAX_IMAGE_BYTES=16777216
      - MAX_FFMPEG_CONCURRENT=8
      - RUST_LOG=info
      # Behind a reverse proxy: its network, e.g. 172.18.0.0/16. Empty = TCP peer is the client.
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      # Name only — value lives in Coolify (007). Unset keeps /metrics a 404.
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:-}
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
          pids: 512
        reservations:
          cpus: '1'
          memory: 512M
